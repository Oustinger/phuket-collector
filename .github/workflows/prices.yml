name: Цены на билеты

on:
  schedule:
    - cron: "23 21 * * *" # ставим сильно заранее: GitHub задерживает запуск на 1–4 ч,
                          # фактически файл ложится к 00:30–01:30 UTC, до разбора в 05:00
    - cron: "23 9 * * *"  # то же для вечернего разбора: ложится к 12:30–13:30 UTC, до 17:00
  workflow_dispatch:       # кнопка «запустить вручную» во вкладке Actions

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать цены
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python collect.py

      - name: Закоммитить результат
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Цены на $(date -u +'%F %H:%M') UTC"
          git push
